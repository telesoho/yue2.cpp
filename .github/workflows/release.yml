name: Build & Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach binaries to (e.g. v0.1.0)'
        required: true
        type: string
      skip_linux:
        description: 'Skip Linux build'
        required: false
        type: boolean
        default: false
      skip_mac:
        description: 'Skip macOS build'
        required: false
        type: boolean
        default: false
      skip_windows:
        description: 'Skip Windows build'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build · linux-x64
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential pkg-config libopenblas-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: build-linux-ubuntu-22.04

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.6.0'
          log-file-suffix: 'ubuntu-22.04.txt'

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Configure & Build
        run: |
          ./buildall.sh

      - name: Smoke test
        continue-on-error: true
        shell: bash
        run: |
          BIN="build"
          for b in yue-plan yue-synth yue-server yue-tokenize yue-transcribe neural-codec quantize mp3-codec; do
            "$BIN/$b" 2>&1 | head -5 || true
          done

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          cp -P build/yue-* build/neural-codec build/quantize build/mp3-codec build/*.so dist/
          tar -C dist -czf "yue2-linux-x64.tar.gz" .

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.value }}" \
            "yue2-linux-x64.tar.gz" \
            --clobber

  build-mac:
    name: Build · macos-arm64-metal
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: build-mac-macos-latest

      - name: Configure & Build
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release -j "$(sysctl -n hw.ncpu)"

      - name: Smoke test
        continue-on-error: true
        shell: bash
        run: |
          BIN="build"
          for b in yue-plan yue-synth yue-server yue-tokenize yue-transcribe neural-codec quantize mp3-codec; do
            "$BIN/$b" 2>&1 | head -5 || true
          done

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          cd build
          shopt -s nullglob
          bins=(yue-* neural-codec quantize mp3-codec)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "No release binaries found in build/" >&2
            ls -la
            exit 1
          fi
          for bin in "${bins[@]}"; do
            install_name_tool -add_rpath @executable_path "$bin"
          done
          cp -P "${bins[@]}" libggml*.dylib ../dist/
          cd ..
          tar -C dist -czf "yue2-macos-arm64-metal.tar.gz" .

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.value }}" \
            "yue2-macos-arm64-metal.tar.gz" \
            --clobber

  build-windows:
    name: Build · windows-x64
    runs-on: windows-2022
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CUDA toolkit
        id: cache-cuda
        uses: actions/cache@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
          key: cuda-12.6.0-windows-2022

      - name: Install CUDA toolkit
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.6.0'
          log-file-suffix: 'windows-2022.txt'

      - name: Restore CUDA env from cache
        if: steps.cache-cuda.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $cudaRoot = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6'
          if (-not (Test-Path "$cudaRoot\bin\nvcc.exe")) {
            throw "CUDA cache hit but nvcc not found at $cudaRoot"
          }
          Add-Content $env:GITHUB_ENV "CUDA_PATH=$cudaRoot"
          Add-Content $env:GITHUB_ENV "CUDA_PATH_V12_6=$cudaRoot"
          Add-Content $env:GITHUB_PATH "$cudaRoot\bin"

          # Jimver/cuda-toolkit also installs CUDA MSBuild integration into
          # Visual Studio. The toolkit cache does not include those VS files,
          # so copy them from extras or MSBuild looks for "CUDA .props".
          $src = Join-Path $cudaRoot 'extras\visual_studio_integration\MSBuildExtensions'
          if (-not (Test-Path $src)) {
            throw "CUDA VS integration not found at $src"
          }
          $dest = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\MSBuild\Microsoft\VC\v170\BuildCustomizations' -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dest) {
            throw "Visual Studio 2022 BuildCustomizations directory not found"
          }
          Copy-Item (Join-Path $src '*') $dest -Force

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # humbletim/install-vulkan-sdk's 7z extract does not ship
          # SPIRV-HeadersConfig.cmake on Windows; ggml needs it for
          # find_package(SPIRV-Headers CONFIG). LunarG's official
          # installer from 1.4.313.2+ does.
          $ver = '1.4.313.2'
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          curl.exe -fL -o $installer "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan-sdk.exe"
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$ver"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$ver\bin"

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build-msvc
          key: build-msvc-${{ github.sha }}

      - name: Configure & Build
        shell: pwsh
        run: |
          # Configure — only print errors
          cmake -S . -B build-msvc `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_CUDA=ON `
            -DGGML_VULKAN=ON `
            -DGGML_BACKEND_DL=ON `
            --log-level=ERROR 2>&1 | Where-Object { $_ -notmatch '^--' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Build — suppress per-file progress, only show warnings/errors
          cmake --build build-msvc --config Release -j $env:NUMBER_OF_PROCESSORS `
            -- /v:minimal /consoleloggerparameters:ErrorsOnly 2>&1 `
            | Where-Object { $_ -match '(error|warning|FAILED|fatal)' -or $_ -eq '' } `
            | Select-Object -Last 50
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test
        continue-on-error: true
        shell: bash
        run: |
          BIN="build-msvc/Release"
          for b in yue-plan yue-synth yue-server yue-tokenize yue-transcribe neural-codec quantize mp3-codec; do
            "$BIN/$b.exe" 2>&1 | head -5 || true
          done

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Package binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build-msvc\Release\*.exe" dist\ -ErrorAction SilentlyContinue
          Copy-Item "build-msvc\Release\*.dll" dist\ -ErrorAction SilentlyContinue
          if (-not (Get-ChildItem dist -File -ErrorAction SilentlyContinue)) {
            throw "No binaries found under build-msvc\Release"
          }
          Compress-Archive -Path dist\* -DestinationPath "yue2-windows-x64.zip" -Force

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ steps.tag.outputs.value }}" `
            "yue2-windows-x64.zip" `
            --clobber
